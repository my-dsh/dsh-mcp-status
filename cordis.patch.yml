# The dsh-mcp-status bundle patch: one row that contributes the composer-toolbar
# button and the Host routes behind it.
#
# The row changes no MCP configuration. It reads the profile's
# `@deepseek-ai/dsh-mcp-client` rows (serverName, transport, live fiber phase,
# registered tool count) and opens or closes each connection on demand.
#
# Nothing is persisted. The set of open connections lives in memory for the life
# of the plugin instance, so every start begins with all servers disconnected and
# the user opens the ones this run needs. That is the point: a rarely used server
# never costs a startup connection, a child process, or a reconnect loop nobody
# asked for.

# Keep the MCP rows themselves disabled in the profile (`disabled: true`) so the
# Loader mounts none of them: the panel is the only thing that connects, which is
# what keeps a fresh install from opening any connection at startup.

- insert:
    - id: mcp-status
      name: '@my-dsh/dsh-mcp-status'

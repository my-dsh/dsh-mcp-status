<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 D · 图标行</title>
<style>
  /* Direction D — Raycast store rows.
     Each server gets a face. The icon tile's border carries the state, so the
     three rows are told apart before any word is read. Borrowed from Raycast's
     extension list: 48px rows, a 30px icon tile, a single-line grey description
     that truncates, and a fixed-width action column on the right. */
  :root {
    --menu: var(--dsw-specific-menu, #f8f9fa);
    --ink: var(--dsw-alias-label-primary, #0f1115);
    --dim: var(--dsw-alias-label-secondary, #61666b);
    --faint: var(--dsw-alias-label-tertiary, #81858c);
    --line: var(--dsw-alias-border-l1, #0000000a);
    --line-2: var(--dsw-alias-border-l2, #0000001a);
    --ok: var(--dsw-alias-state-success-primary, #22c55e);
    --live: var(--dsw-alias-state-business-primary, #4176e6);
    --bad: var(--dsw-alias-state-error-primary, #ec1313);
    --hover: var(--dsw-alias-interactive-bg-hover, #2631480f);
    --radius-lg: var(--dsw-radius-lg, 16px);
    --radius-md: var(--dsw-radius-md, 12px);
    --radius-sm: var(--dsw-radius-sm, 8px);
    --shadow: var(--dsw-elevation-prominent, 0 0 0 .5px #00000029, 0 3px 8px #0000000a);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 48px 20px;
    background: #e9ebee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    width: 340px; max-width: 100%;
    border-radius: var(--radius-lg);
    background: var(--menu);
    -webkit-backdrop-filter: var(--dsw-menu-backdrop-filter, blur(40px) saturate(150%));
    backdrop-filter: var(--dsw-menu-backdrop-filter, blur(40px) saturate(150%));
    box-shadow: var(--shadow);
    color: var(--dim);
    padding: 13px 8px 7px;
    overflow: hidden;
  }

  .head { display: flex; align-items: center; gap: 8px; padding: 0 7px 10px; }
  .title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .count {
    margin-left: auto; font-size: 11px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .count b { color: var(--ink); font-weight: 600; }

  .row {
    display: flex; align-items: center; gap: 10px;
    min-height: 48px; padding: 5px 7px;
    border-radius: var(--radius-md);
    transition: background 90ms linear;
  }
  .row:hover { background: var(--hover); }

  /* icon tile: its border is the state */
  .tile {
    width: 30px; height: 30px; flex: none;
    display: grid; place-items: center;
    border-radius: var(--radius-sm);
    background: var(--dsw-alias-bg-layer-2, #ffffff80);
    border: 1.5px solid var(--line-2);
    color: var(--faint);
    transition: border-color 130ms ease, background 130ms ease, color 130ms ease;
  }
  .row[data-on='true'] .tile {
    border-color: var(--live);
    background: color-mix(in srgb, var(--live) 10%, transparent);
    color: var(--live);
  }
  .row[data-bad='true'] .tile {
    border-color: var(--bad);
    background: color-mix(in srgb, var(--bad) 10%, transparent);
    color: var(--bad);
  }
  .row[data-loading='true'] .tile { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  .body { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .name {
    font-size: 13px; font-weight: 500; line-height: 17px; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta {
    font-size: 11px; line-height: 15px; color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 178px;
  }

  /* action column: a word, not a switch — the whole row is the control */
  .act {
    margin-left: auto; flex: none;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 500; letter-spacing: .01em;
    color: var(--faint);
    padding: 5px 8px; border-radius: 7px;
    background: transparent; border: 1px solid transparent;
    cursor: pointer; font-family: inherit;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .row[data-on='true'] .act { color: var(--live); }
  .act:hover { border-color: var(--line-2); background: var(--dsw-alias-bg-layer-2, #ffffff80); }
  .act:active { transform: translateY(.5px); }
  .act:disabled { cursor: progress; opacity: .55; }
  .act:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--live); }
  .act i {
    width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: none;
  }
  .row[data-on='true'] .act i { background: var(--ok); }

  /* second group header, so a long list still reads */
  .sep {
    display: flex; align-items: center; gap: 8px;
    margin: 6px 7px 2px; padding-top: 8px;
    border-top: 1px solid var(--line);
    font-size: 10px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint);
  }

  .foot {
    display: flex; align-items: center; gap: 6px;
    margin: 6px 0 0; padding: 9px 7px 6px;
    border-top: 1px solid var(--line);
    font-size: 11px; line-height: 15px; color: var(--faint);
  }
  .foot svg { flex: none; opacity: .75; }
  .foot[data-bad='true'] { color: var(--bad); }

  .label {
    position: fixed; top: 18px; left: 20px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #8b9096;
  }
  .dark {
    margin: 34px -20px -48px; padding: 44px 20px;
    background: #17191c; display: grid; place-items: center;
    border-top: 1px solid #d3d7db;
  }
  .dark .panel {
    --menu: #202226; --ink: #f2f3f5; --dim: #a8adb4; --faint: #7d828a;
    --line: #ffffff14; --line-2: #ffffff26; --hover: #ffffff0f;
    --shadow: 0 0 0 .5px #ffffff24, 0 8px 28px #00000066;
  }
  .dark .tile { background: #ffffff0a; }
  .dark .act:hover { background: #ffffff0f; }
  .dark .label { position: static; color: #6c727a; margin-bottom: 22px; }
</style>
</head>
<body>
<div class="label">Direction D · Icon rows</div>

  <div class="row">

    </span>
    <button class="act" aria-pressed="false" aria-label="连接 mysqlob"><i></i>连接</button>
  </div>

  <div class="foot">
    <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3">
      <rect x="1.4" y="1.4" width="9.2" height="9.2" rx="2"/>
      <path d="M3.6 6l1.7 1.7L8.6 4.4"/>
    </svg>
    按工作区记录，重启后恢复
  </div>
</div>
